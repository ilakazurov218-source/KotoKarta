<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КотоКарта — прототип с картой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://api-maps.yandex.ru/2.1/?apikey=587c2114-0c50-413c-967e-df7e3167ce21&lang=ru_RU" type="text/javascript"></script>
<style>
  :root{
    --asphalt:#1E2124;
    --asphalt-2:#26292D;
    --amber:#FF7A29;
    --amber-dark:#E5651A;
    --teal:#2BA88C;
    --paper:#FAF7F2;
    --paper-dim:#EFEAE1;
    --ink:#20211D;
    --ink-soft:#6B675E;
    --danger:#D65B4A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; height:100dvh; overflow:hidden; background:var(--asphalt); font-family:'Manrope',sans-serif;}
  #stage{position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden;}
  #map{position:absolute; inset:0;}

  /* top bar: search + district */
  #topbar{
    position:absolute; top:16px; left:16px; right:16px; z-index:10;
    display:flex; gap:10px; align-items:center;
  }
  #search-wrap{
    flex:1; display:flex; align-items:center; gap:8px;
    background:rgba(30,33,36,.88); backdrop-filter:blur(8px);
    border:1px solid #34383C; border-radius:16px; padding:0 6px 0 14px; height:48px;
    min-width:0;
  }
  #search-wrap svg{flex-shrink:0; opacity:.6;}
  #search-btn{
    flex-shrink:0; background:var(--amber); border:none; border-radius:11px; height:40px; width:44px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  #search-btn:active{filter:brightness(.92);}
  #search-input{
    flex:1; min-width:0; background:transparent; border:none; outline:none; color:#fff;
    font-family:'Manrope'; font-size:14px; height:100%;
  }
  #search-input::placeholder{color:#8C9096;}
  .ymaps-2-1-79-search__suggest, .ymaps-2-1-79-suggest-item{font-family:'Manrope' !important;}
  #district-select{
    background:rgba(30,33,36,.88); backdrop-filter:blur(8px); border:1px solid #34383C;
    color:#fff; font-family:'Manrope'; font-size:13px; font-weight:700;
    border-radius:16px; height:48px; padding:0 12px; outline:none; cursor:pointer;
    flex-shrink:0;
  }
  #district-select option{background:var(--asphalt-2); color:#fff;}

  .hint{
    position:absolute; top:74px; right:16px; z-index:10; color:#8C9096; font-size:12px; font-weight:600;
    background:rgba(30,33,36,.7); padding:8px 12px; border-radius:999px; border:1px solid #34383C;
    transition:opacity .4s ease;
  }
  .hint.hidden{opacity:0; pointer-events:none;}

  /* custom placemark */
  .cat-pin{position:relative; width:56px; height:68px; cursor:pointer; filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));}
  .cat-pin svg{width:100%; height:100%; display:block;}
  .cat-pin img{position:absolute; top:5px; left:10px; width:36px; height:36px; border-radius:50%; object-fit:cover; border:2.5px solid var(--paper);}

  /* --- SHEET --- */
  #sheet{
    position:absolute; left:50%; bottom:0; width:min(420px,100%);
    transform:translate(-50%,105%); z-index:20;
    background:var(--paper); border-radius:26px 26px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
    transition:transform .38s cubic-bezier(.22,1,.36,1);
    max-height:78vh; overflow:hidden; display:flex; flex-direction:column;
  }
  #sheet.open{transform:translate(-50%,0);}
  .sheet-handle{width:40px; height:5px; background:#DDD6C8; border-radius:99px; margin:12px auto 4px;}
  .sheet-scroll{overflow-y:auto; padding:6px 26px 26px; padding-bottom:calc(26px + env(safe-area-inset-bottom));}
  .sheet-close{
    position:absolute; top:16px; right:18px; width:32px; height:32px; border-radius:50%;
    background:var(--paper-dim); border:none; color:var(--ink-soft); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .hero-row{display:flex; align-items:center; gap:14px; margin:8px 0 4px;}
  .hero-photo{width:64px; height:64px; border-radius:18px; overflow:hidden; flex-shrink:0; border:2px solid var(--paper-dim);}
  .hero-photo img{width:100%; height:100%; object-fit:cover;}
  .hero-name{font-family:'Baloo 2'; font-weight:700; font-size:28px; color:var(--ink); line-height:1;}
  .hero-status{
    display:inline-flex; align-items:center; gap:6px; margin-top:6px;
    font-size:12px; font-weight:700; color:var(--teal); background:#E4F4EF;
    padding:4px 10px; border-radius:999px;
  }
  .hero-status .dot{width:6px; height:6px; border-radius:50%; background:var(--teal);}
  .desc{color:var(--ink-soft); font-size:14.5px; line-height:1.55; margin:14px 0 18px;}
  .stats-row{display:flex; gap:10px; margin-bottom:18px;}
  .stat{flex:1; background:var(--paper-dim); border-radius:14px; padding:10px 12px; min-width:0;}
  .stat b{display:block; font-family:'Baloo 2'; font-size:19px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stat span{font-size:11.5px; color:var(--ink-soft);}
  .btn{
    width:100%; border:none; border-radius:16px; padding:16px 18px; font-family:'Manrope';
    font-weight:700; font-size:15.5px; cursor:pointer; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; transition:transform .12s ease, filter .12s ease;
    touch-action:manipulation;
  }
  .btn:active{transform:scale(.98);}
  .btn-donate{background:var(--amber); color:#241000;}
  .btn-donate:hover{filter:brightness(1.05);}
  .btn-donate small{font-weight:600; opacity:.75; font-size:12.5px;}
  .btn-care{background:var(--ink); color:var(--paper);}
  .btn-care.done{background:var(--teal); color:#fff;}
  .btn-report{
    background:transparent; color:var(--ink-soft); font-weight:600; font-size:13.5px;
    padding:8px 4px; justify-content:center; gap:6px; margin-top:2px; margin-bottom:0;
  }
  .btn-report:hover{color:var(--danger);}
  .amounts{display:flex; gap:8px; margin:-2px 0 12px; flex-wrap:wrap;}
  .amt{
    flex:1; padding:10px 0; text-align:center; border-radius:12px; border:1.5px solid var(--paper-dim);
    background:transparent; font-weight:700; color:var(--ink); cursor:pointer; font-family:'Manrope'; font-size:14px;
    touch-action:manipulation;
  }
  .amt.selected{border-color:var(--amber); background:#FFF1E6; color:var(--amber-dark);}
  .amt-custom{flex:1.4; font-size:12.5px;}
  .custom-amount-row{display:flex; gap:8px; margin:-4px 0 12px;}
  .custom-amount-input{
    flex:1; padding:10px 12px; border-radius:12px; border:1.5px solid var(--paper-dim);
    font-family:'Manrope'; font-weight:700; font-size:14px; color:var(--ink); background:var(--paper);
  }
  .custom-amount-input:focus{outline:none; border-color:var(--amber);}
  .custom-amount-ok{
    padding:10px 18px; border-radius:12px; border:none; background:var(--ink); color:var(--paper);
    font-family:'Manrope'; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .toast{
    position:absolute; left:50%; bottom:26px; transform:translate(-50%,20px); opacity:0;
    background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:14px;
    font-size:13.5px; font-weight:600; pointer-events:none; transition:all .3s ease; z-index:30;
    box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:calc(100% - 32px); text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  /* --- ADD BUTTON --- */
  #add-fab{
    position:absolute; right:18px; bottom:26px; z-index:15;
    right:calc(18px + env(safe-area-inset-right));
    bottom:calc(26px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%; border:none; cursor:pointer;
    background:var(--amber); color:#241000; font-size:28px; font-weight:700;
    box-shadow:0 10px 24px rgba(255,122,41,.45); display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease; touch-action:manipulation;
  }
  #add-fab:active{transform:scale(.93);}

  /* --- ADD FORM SHEET --- */
  #add-sheet{
    position:absolute; left:50%; bottom:0; width:min(420px,100%);
    transform:translate(-50%,105%); z-index:25;
    background:var(--paper); border-radius:26px 26px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,.5);
    transition:transform .38s cubic-bezier(.22,1,.36,1);
    max-height:86vh; overflow:hidden; display:flex; flex-direction:column;
  }
  #add-sheet.open{transform:translate(-50%,0);}
  .form-scroll{overflow-y:auto; padding:6px 26px 26px; padding-bottom:calc(26px + env(safe-area-inset-bottom));}
  .form-title{
    font-family:'Baloo 2'; font-weight:700; font-size:24px; margin:10px 0 18px;
    background:linear-gradient(90deg, var(--amber) 0%, var(--amber-dark) 35%, var(--teal) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .photo-upload{
    display:flex; align-items:center; gap:14px; margin-bottom:20px; flex-wrap:wrap;
  }
  .form-mascot{
    width:54px; height:54px; object-fit:contain; margin-left:auto; flex-shrink:0;
  }
  .photo-preview{
    width:76px; height:76px; border-radius:20px; background:var(--paper-dim);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;
    border:2px dashed #D8D0C2;
  }
  .photo-preview img{width:100%; height:100%; object-fit:cover;}
  .photo-preview svg{opacity:.4;}
  .upload-btn-label{
    display:inline-flex; align-items:center; gap:8px; background:var(--ink); color:var(--paper);
    font-family:'Manrope'; font-weight:700; font-size:13.5px; padding:11px 16px; border-radius:14px;
    cursor:pointer; touch-action:manipulation;
  }
  .upload-hint{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}

  .field-label{font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; margin:0 0 6px;}
  .field-input, .field-textarea{
    width:100%; border:1.5px solid var(--paper-dim); background:#fff; border-radius:14px;
    padding:12px 14px; font-family:'Manrope'; font-size:14.5px; color:var(--ink); margin-bottom:16px; outline:none;
  }
  .field-input:focus, .field-textarea:focus{border-color:var(--amber);}
  .field-textarea{resize:none; min-height:70px;}
  .field-select{
    width:100%; border:1.5px solid var(--paper-dim); background:#fff; border-radius:14px;
    padding:12px 14px; font-family:'Manrope'; font-size:14.5px; color:var(--ink); margin-bottom:16px; outline:none;
  }
  .location-note{
    display:flex; align-items:center; gap:8px; background:var(--paper-dim); border-radius:12px;
    padding:10px 12px; font-size:12.5px; color:var(--ink-soft); margin-bottom:18px;
  }

  /* crosshair shown on map while placing a point */
  #placing-crosshair{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-100%);
    z-index:12; display:none; pointer-events:none;
  }
  #placing-crosshair.show{display:block;}
  #placing-crosshair svg{filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));}

  .locate-row{display:flex; gap:8px; margin-bottom:16px;}
  .locate-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:#fff; border:1.5px solid var(--paper-dim); border-radius:12px;
    padding:11px 8px; font-family:'Manrope'; font-weight:700; font-size:12.5px; color:var(--ink);
    cursor:pointer; touch-action:manipulation;
  }
  .locate-btn:hover{border-color:var(--amber);}
  .address-row{display:flex; gap:8px; margin-bottom:6px;}
  .address-row .field-input{margin-bottom:0; flex:1; min-width:0;}
  .address-find-btn{
    background:var(--ink); color:var(--paper); border:none; border-radius:12px; padding:0 16px;
    font-family:'Manrope'; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0;
    touch-action:manipulation;
  }

  /* ===================== MOBILE ADJUSTMENTS ===================== */
  @media (max-width:480px){
    #topbar{
      top:calc(12px + env(safe-area-inset-top)); left:12px; right:12px; gap:8px;
    }
    #search-wrap{ height:46px; padding:0 4px 0 12px; border-radius:14px; }
    #search-input{ font-size:13px; }
    #search-btn{ width:40px; height:36px; }
    #district-select{
      max-width:96px; font-size:11px; padding:0 8px; height:46px; border-radius:14px;
    }
    .hint{ display:none; }

    .cat-pin{ width:46px; height:56px; }
    .cat-pin img{ width:30px; height:30px; top:4px; left:8px; }

    #add-fab{ width:52px; height:52px; font-size:24px; }

    #sheet, #add-sheet{
      width:100%; left:0; right:0; transform:translateY(105%);
      border-radius:20px 20px 0 0; max-height:88dvh;
    }
    #sheet.open, #add-sheet.open{ transform:translateY(0); }
    .sheet-scroll, .form-scroll{ padding:6px 16px 20px; padding-bottom:calc(20px + env(safe-area-inset-bottom)); }

    .hero-photo{ width:52px; height:52px; border-radius:14px; }
    .hero-name{ font-size:21px; }
    .hero-status{ font-size:11px; padding:3px 8px; }
    .desc{ font-size:13.5px; margin:12px 0 14px; }

    .stats-row{ gap:6px; margin-bottom:14px; }
    .stat{ padding:8px 8px; }
    .stat b{ font-size:15px; }
    .stat span{ font-size:9.5px; }

    .amounts{ gap:6px; }
    .amt{ font-size:12px; padding:9px 0; }

    .btn{ padding:14px 14px; font-size:14px; }

    .form-title{ font-size:20px; margin:8px 0 14px; }
    .photo-preview{ width:60px; height:60px; border-radius:16px; }
    .form-mascot{ width:38px; height:38px; }
    .upload-btn-label{ font-size:12.5px; padding:10px 14px; }

    .field-input, .field-textarea, .field-select{ padding:11px 12px; font-size:14px; margin-bottom:12px; }

    .locate-row{ flex-direction:column; gap:8px; }
    .address-row{ flex-direction:column; }
    .address-find-btn{ padding:11px 16px; align-self:flex-start; }

    .toast{ bottom:calc(20px + env(safe-area-inset-bottom)); font-size:13px; padding:10px 16px; }
  }
</style>
</head>
<body>

<!-- ============== FIREBASE INIT ============== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATGtNyzMIvG3ImJzg2_Aze9DYl4ZhJkPM",
    authDomain: "catmap-3efd7.firebaseapp.com",
    projectId: "catmap-3efd7",
    storageBucket: "catmap-3efd7.firebasestorage.app",
    messagingSenderId: "396893794995",
    appId: "1:396893794995:web:9c3a4e2d19be9fe74ef6c6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // делаем доступным для основного скрипта карты (он подключается ниже обычным <script>, не модулем)
  window.db = db;
  window.fsCollection = collection;
  window.fsAddDoc = addDoc;
  window.fsGetDocs = getDocs;
  window.firebaseReady = true;
</script>
<!-- ============================================= -->

<div id="stage">
  <div id="map"></div>

  <div id="topbar">
    <div id="search-wrap">
      <button id="search-btn" onclick="doSearch()" aria-label="Искать">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <input id="search-input" type="text" placeholder="Найти город или адрес...">
    </div>
    <select id="district-select" onchange="changeDistrict()">
      <option value="all">Все районы</option>
      <option value="north">Северный</option>
      <option value="south">Южный</option>
      <option value="center">Центральный</option>
    </select>
  </div>
  <div class="hint" id="hint">нажми на пин →</div>

  <div id="placing-crosshair">
    <svg width="40" height="52" viewBox="0 0 40 52">
      <path d="M20 0C9 0 0 9 0 20c0 14 20 32 20 32s20-18 20-32C40 9 31 0 20 0z" fill="none" stroke="#FF7A29" stroke-width="3" stroke-dasharray="4 3"/>
      <circle cx="20" cy="20" r="6" fill="#FF7A29"/>
    </svg>
  </div>

  <!-- sheet -->
  <div id="sheet">
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
    <div class="sheet-scroll">
      <div class="hero-row">
        <div class="hero-photo"><img id="sheet-photo" src="" alt=""></div>
        <div>
          <div class="hero-name" id="sheet-name">Это Барсик</div>
          <div class="hero-status" id="sheet-status"><span class="dot"></span>есть ответственный</div>
        </div>
      </div>
      <div class="desc" id="sheet-desc"></div>
      <div class="stats-row">
        <div class="stat"><b id="stat-cats">1</b><span>кошка на точке</span></div>
        <div class="stat"><b id="stat-donations">2 450 ₽</b><span>собрано за месяц</span></div>
        <div class="stat"><b id="stat-feeds">14</b><span>покормили в этом месяце</span></div>
      </div>
      <div class="amounts" id="amounts">
        <button class="amt" data-v="150">150 ₽</button>
        <button class="amt selected" data-v="350">350 ₽</button>
        <button class="amt" data-v="700">700 ₽</button>
        <button class="amt amt-custom" id="amt-custom-btn" data-v="custom">Свой вариант</button>
      </div>
      <div class="custom-amount-row" id="custom-amount-row" style="display:none;">
        <input type="number" id="custom-amount-input" class="custom-amount-input" min="150" step="10" placeholder="От 150 ₽">
        <button class="custom-amount-ok" onclick="applyCustomAmount()">Ок</button>
      </div>
      <button class="btn btn-donate" onclick="donate()">
        <span>Задонатить <span id="amt-label">350 ₽</span></span>
        <small>идёт на корм</small>
      </button>
      <button class="btn btn-care" id="care-btn" onclick="toggleCare()">
        <span>Стать ответственным</span>
        <span>🐾</span>
      </button>
      <button class="btn btn-report" onclick="report()">⚠ Пожаловаться на точку</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- add point button -->
  <button id="add-fab" onclick="openAddSheet()">+</button>

  <!-- add point form -->
  <div id="add-sheet">
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="closeAddSheet()">✕</button>
    <div class="form-scroll">
      <div class="form-title">Новая анкета</div>

      <div class="photo-upload">
        <div class="photo-preview" id="photo-preview">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B675E" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
        </div>
        <div>
          <label class="upload-btn-label" for="photo-input">
            📷 Загрузить фото
          </label>
          <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">

<script>
// ------- data -------
const animals = {
  barsik: {
    name:"Это Барсик", coords:[54.5140,36.2610], district:"north",
    photo:"https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=200&h=200&fit=crop",
    desc:"Барсик живёт в коробке у гаражей и питается голубями. Заметен во дворе примерно с прошлой зимы.",
    status:"есть ответственный", statusOn:true, cats:"1", donations:"2 450 ₽", feeds:"14"
  },
  musya: {
    name:"Это Муся", coords:[54.5310,36.2720], district:"north",
    photo:"https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=200&h=200&fit=crop",
    desc:"Муся с двумя котятами прячется под теплотрассой возле детской площадки. Очень пугливая, но охотно ест.",
    status:"точка свободна", statusOn:false, cats:"3", donations:"640 ₽", feeds:"3"
  },
  tishka: {
    name:"Это Тишка", coords:[54.4980,36.2900], district:"south",
    photo:"https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=200&h=200&fit=crop",
    desc:"Тишка живёт у продуктового магазина, его подкармливают продавщицы, но корма часто не хватает на весь день.",
    status:"есть ответственный", statusOn:true, cats:"1", donations:"1 120 ₽", feeds:"9"
  },
  murka: {
    name:"Это Мурка", coords:[54.5293,36.2754], district:"center",
    photo:"https://images.unsplash.com/photo-1466721591366-2d5fba72006d?w=200&h=200&fit=crop",
    desc:"Мурка обитает во дворе у центрального рынка, дружелюбная, часто выходит навстречу людям.",
    status:"точка свободна", statusOn:false, cats:"2", donations:"310 ₽", feeds:"2"
  }
};

let current = "barsik";
let selectedAmount = 350;
let caredFor = {barsik:true, musya:false, tishka:false, murka:false};
let map, placemarks = {}, mapReady = false;

ymaps.ready(initMap);

function initMap(){
  map = new ymaps.Map("map", {
    center:[54.5293,36.2754], // пример: региональный центр (Калуга) — замени на свой город
    zoom:13,
    controls:["zoomControl"]
  }, {
    suppressMapOpenBlock:true
  });

  Object.keys(animals).forEach(id=>{
    addMarkerForAnimal(id, animals[id]);
  });
  mapReady = true;

  // подсказки городов/адресов при вводе — верхняя строка поиска
  const suggestView = new ymaps.SuggestView('search-input');
  suggestView.events.add('select', function(e){
    const selected = e.get('item').value;
    document.getElementById('search-input').value = selected;
    doSearch();
  });

  // подсказки улиц/адресов при вводе — поле адреса в форме добавления анкеты
  const suggestViewAddress = new ymaps.SuggestView('new-address');
  suggestViewAddress.events.add('select', function(e){
    const selected = e.get('item').value;
    document.getElementById('new-address').value = selected;
    findAddressForNewPoint();
  });

  // подгружаем анкеты, добавленные другими пользователями, из Firestore
  loadAnimalsFromFirestore();
}

// ------- создание метки на карте (общая функция для демо-животных, загруженных из базы и новых) -------
function addMarkerForAnimal(id, a){
  const layout = ymaps.templateLayoutFactory.createClass(
    '<div class="cat-pin">' +
      '<svg viewBox="0 0 56 68"><path d="M28 0C12.5 0 0 12.5 0 28c0 19 28 40 28 40s28-21 28-40C56 12.5 43.5 0 28 0z" fill="' + (a.statusOn ? "#FF7A29" : "#2BA88C") + '"/></svg>' +
      '<img src="' + a.photo + '">' +
    '</div>'
  );

  const pm = new ymaps.Placemark(a.coords, {}, {
    iconLayout: layout,
    iconShape: {type:"Rectangle", coordinates:[[0,0],[56,68]]},
    iconOffset: [-28,-68]
  });

  pm.events.add('click', ()=>{ openSheet(id); dismissHint(); });
  placemarks[id] = pm;
  map.geoObjects.add(pm);
}

// ------- загрузка анкет из Firestore -------
async function loadAnimalsFromFirestore(){
  if(!window.firebaseReady) return;
  try{
    const snapshot = await window.fsGetDocs(window.fsCollection(window.db, "animals"));
    snapshot.forEach(docSnap=>{
      const id = docSnap.id;
      if(animals[id]) return; // уже есть (на всякий случай)
      const a = docSnap.data();
      animals[id] = a;
      caredFor[id] = false;
      addMarkerForAnimal(id, a);
    });
  }catch(err){
    console.error("Ошибка загрузки анкет из Firestore:", err);
  }
}

// ------- search by address (uses built-in geocode from JS API) -------
function doSearch(){
  const input = document.getElementById('search-input');
  const q = input.value.trim();
  if(!q){
    showToast('Сначала впиши город или адрес');
    return;
  }
  if(!mapReady){
    showToast('Карта ещё загружается, попробуй через секунду');
    return;
  }
  showToast('Ищу "' + q + '"...');
  geocodeAddress(q).then(coords=>{
    if(coords){
      map.setCenter(coords, 12, {duration:400});
      showToast('Нашёл: ' + q);
    } else {
      showToast('Ничего не нашлось по этому адресу');
    }
  }).catch(err=>{
    showToast('Ошибка поиска: ' + err.message);
    console.error(err);
  });
}

// прямой запрос к HTTP Геокодеру Яндекса (в обход встроенной ymaps.geocode)
const GEOCODER_KEY = '1783464b-f6cf-457e-85f9-9fac61b9a1fc';
function geocodeAddress(query){
  const url = 'https://geocode-maps.yandex.ru/1.x/?apikey=' + GEOCODER_KEY +
              '&geocode=' + encodeURIComponent(query) + '&format=json';
  return fetch(url)
    .then(r=>{
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(data=>{
      const members = data.response.GeoObjectCollection.featureMember;
      if(!members || !members.length) return null;
      const pos = members[0].GeoObject.Point.pos; // "lon lat"
      const [lon, lat] = pos.split(' ').map(Number);
      return [lat, lon]; // ymaps ждёт [lat, lon]
    });
}

document.getElementById('search-input').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    doSearch();
  }
});

// ------- district filter -------
function changeDistrict(){
  const val = document.getElementById('district-select').value;
  Object.keys(animals).forEach(id=>{
    const show = (val === 'all' || animals[id].district === val);
    if(placemarks[id]) placemarks[id].options.set('visible', show);
  });
  closeSheet();
}

// ------- sheet logic (same as before) -------
function openSheet(id){
  current = id;
  const a = animals[id];
  document.getElementById('sheet-photo').src = a.photo;
  document.getElementById('sheet-name').textContent = a.name;
  document.getElementById('sheet-desc').textContent = a.desc;
  document.getElementById('stat-cats').textContent = a.cats;
  document.getElementById('stat-donations').textContent = a.donations;
  document.getElementById('stat-feeds').textContent = a.feeds;

  const statusEl = document.getElementById('sheet-status');
  statusEl.innerHTML = '<span class="dot"></span>' + a.status;
  statusEl.style.color = a.statusOn ? '#2BA88C' : '#C98A2C';
  statusEl.style.background = a.statusOn ? '#E4F4EF' : '#FBF0DF';
  statusEl.querySelector('.dot').style.background = a.statusOn ? '#2BA88C' : '#C98A2C';

  updateCareBtn();
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
}
function updateCareBtn(){
  const btn = document.getElementById('care-btn');
  if(caredFor[current]){
    btn.classList.add('done');
    btn.innerHTML = '<span>Ты отвечаешь за эту точку</span><span>✓</span>';
  } else {
    btn.classList.remove('done');
    btn.innerHTML = '<span>Стать ответственным</span><span>🐾</span>';
  }
}
function toggleCare(){
  caredFor[current] = !caredFor[current];
  updateCareBtn();
  showToast(caredFor[current] ? 'Теперь ты ответственный за эту точку 🐾' : 'Ты больше не отвечаешь за точку');
}
function report(){ showToast('Жалоба отправлена модераторам'); }
function donate(){ showToast('Спасибо! ' + selectedAmount + ' ₽ отправлены на корм'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(()=>t.classList.remove('show'), 2200);
}
function dismissHint(){
  const h = document.getElementById('hint');
  if(h) h.classList.add('hidden');
}

document.querySelectorAll('.amt').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.id === 'amt-custom-btn'){
      document.querySelectorAll('.amt').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      const row = document.getElementById('custom-amount-row');
      row.style.display = 'flex';
      document.getElementById('custom-amount-input').focus();
      return;
    }
    document.getElementById('custom-amount-row').style.display = 'none';
    document.querySelectorAll('.amt').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedAmount = btn.dataset.v;
    document.getElementById('amt-label').textContent = selectedAmount + ' ₽';
  });
});

function applyCustomAmount(){
  const input = document.getElementById('custom-amount-input');
  const val = parseInt(input.value, 10);
  if(!val || val < 150){
    showToast('Минимальная сумма — 150 ₽');
    return;
  }
  selectedAmount = val;
  document.getElementById('amt-label').textContent = val + ' ₽';
  document.getElementById('amt-custom-btn').textContent = val + ' ₽';
  showToast('Сумма ' + val + ' ₽ выбрана');
}

document.getElementById('custom-amount-input').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') applyCustomAmount();
});

openSheet('barsik');
document.getElementById('sheet').classList.remove('open'); // start closed

// ------- add new animal with photo -------
let uploadedPhoto = null;

function handlePhotoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    uploadedPhoto = ev.target.result; // base64 data URL, becomes the avatar
    document.getElementById('photo-preview').innerHTML = '<img src="' + uploadedPhoto + '">';
  };
  reader.readAsDataURL(file);
}

function openAddSheet(){
  closeSheet();
  document.getElementById('add-sheet').classList.add('open');
  document.getElementById('placing-crosshair').classList.add('show');
}
function closeAddSheet(){
  document.getElementById('add-sheet').classList.remove('open');
  document.getElementById('placing-crosshair').classList.remove('show');
}

function useMyLocation(){
  if(!navigator.geolocation){
    showToast('Геолокация не поддерживается этим браузером');
    return;
  }
  showToast('Определяю местоположение...');
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const coords = [pos.coords.latitude, pos.coords.longitude];
      map.setCenter(coords, 16, {duration:400});
      showToast('Карта перемещена к твоей геолокации');
    },
    (err)=>{
      showToast('Не удалось получить геолокацию, разреши доступ в браузере');
    },
    {enableHighAccuracy:true, timeout:8000}
  );
}

function findAddressForNewPoint(){
  const q = document.getElementById('new-address').value.trim();
  if(!q){
    showToast('Впиши адрес в поле выше');
    return;
  }
  if(!mapReady){
    showToast('Карта ещё загружается');
    return;
  }
  showToast('Ищу "' + q + '"...');
  geocodeAddress(q).then(coords=>{
    if(coords){
      map.setCenter(coords, 16, {duration:400});
      showToast('Карта перемещена к этому адресу');
    } else {
      showToast('Адрес не найден, попробуй иначе или подвинь карту вручную');
    }
  }).catch(err=>{
    showToast('Ошибка поиска адреса: ' + err.message);
  });
}

// ------- сохранение новой анкеты в Firestore -------
async function saveNewAnimal(){
  const name = document.getElementById('new-name').value.trim();
  const desc = document.getElementById('new-desc').value.trim();
  const district = document.getElementById('new-district').value;

  if(!name){
    showToast('Придумай кличку, без этого никак');
    return;
  }
  if(!uploadedPhoto){
    showToast('Загрузи фото — оно станет аватаркой');
    return;
  }
  if(!window.firebaseReady){
    showToast('База данных ещё не готова, попробуй через секунду');
    return;
  }

  const center = map.getCenter();

  const newAnimal = {
    name: 'Это ' + name,
    coords: center,
    district: district,
    photo: uploadedPhoto,
    desc: desc || 'Пока без описания.',
    status: 'точка свободна', statusOn:false,
    cats:'1', donations:'0 ₽', feeds:'0',
    createdAt: Date.now()
  };

  showToast('Сохраняю анкету...');

  try{
    const docRef = await window.fsAddDoc(window.fsCollection(window.db, "animals"), newAnimal);
    const id = docRef.id;

    animals[id] = newAnimal;
    caredFor[id] = false;
    addMarkerForAnimal(id, newAnimal);

    // reset form
    document.getElementById('new-name').value = '';
    document.getElementById('new-desc').value = '';
    document.getElementById('new-address').value = '';
    document.getElementById('photo-preview').innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6B675E" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>';
    uploadedPhoto = null;

    closeAddSheet();
    showToast('Анкета добавлена на карту 🐾');
    openSheet(id);
  }catch(err){
    console.error(err);
    showToast('Не удалось сохранить анкету, попробуй ещё раз');
  }
}
</script>
